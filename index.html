<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicTacToe AI Teacher</title>
  <meta name="description"
    content="Teach yourself or your kids to build an AI that plays TicTacToe using Blockly. Analyze your AI's performance against all possible game scenarios." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="manifest" href="/TicTacToe-AI-teacher/manifest.json">
  <meta name="theme-color" content="#4A90E2">
</head>


<body>
  <div id="app">
    <div id="workspace-container">
      <div id="blocklyDiv"></div>
      <button id="toggle-dashboard-btn" style="display: none; position: absolute; top: 1rem; right: 1rem; z-index: 100; border-radius: 50%; width: 40px; height: 40px; padding: 0; justify-content: center;" title="Show Dashboard">▶</button>
    </div>
    <div id="resizer"></div>
    <div id="dashboard">
      <header>
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <h1 data-i18n="app_title">TicTacToe AI Lab</h1>
            <p data-i18n="app_subtitle" style="color: var(--text-dim); font-size: 0.9rem;">Program your AI on the left,
              test it here.</p>
          </div>
          <div class="lang-switcher">
            <button class="lang-btn" data-lang="de">DE</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <!-- Game board -->
      <section class="card">
        <div class="game-board" id="board">
          <!-- Cells will be generated by JS -->
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>
        <div class="controls" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
          <div class="starting-toggle">
            <label class="toggle-option">
              <input type="radio" name="start-player" value="X" checked>
              <span data-i18n="toggle_human_start">Human Starts</span>
            </label>
            <label class="toggle-option">
              <input type="radio" name="start-player" value="O">
              <span data-i18n="toggle_ai_start">AI Starts</span>
            </label>
          </div>
          <button id="reset-game" data-i18n="reset_board">Reset Board</button>
        </div>
      </section>

      <!-- AI Performance: stats hidden bf first evaluation -->
      <section class="card">
        <h2 data-i18n="ai_performance">AI Performance</h2>
        <div id="eval-placeholder"
          style="margin-top: 1rem; text-align: center; color: var(--text-dim); font-size: 0.85rem; padding: 0.5rem 0;">
          <span data-i18n="eval_not_run">No evaluation run yet. Your AI will be analyzed automatically as you
            build.</span>
        </div>

        <!-- after evaluation completes -->
        <div id="eval-results" style="display: none;">
          <div class="stats-grid" style="margin-top: 1rem;">
            <div class="stat-item">
              <span class="stat-value" id="stat-win">—</span>
              <span class="stat-label" data-i18n="win_rate">Win Rate</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-draw">—</span>
              <span class="stat-label" data-i18n="draw_rate">Draw Rate</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-loss">—</span>
              <span class="stat-label" data-i18n="loss_rate">Loss Rate</span>
            </div>
          </div>
          <div id="eval-status"
            style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-dim); text-align: center;"></div>
        </div>


      </section>

      <section class="card">
        <h3 data-i18n="current_strategy">Current Strategy (JS Code)</h3>
        <div id="code-display"
          style="width: 100%; height: 180px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 1rem; color: #38bdf8; padding: 1rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.8rem; margin-top: 0.5rem; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; scrollbar-width: thin;">
          // Your AI code will appear here...</div>
      </section>

      <section class="card">
        <h3 data-i18n="import_strategy">Import Strategy</h3>
        <textarea id="js-input" data-i18n-placeholder="import_placeholder" placeholder="Paste your JavaScript code here...
Example:
if (getBoard()[4] === null) {
  return 4;
}" style="width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: white; padding: 0.5rem; font-family: monospace; font-size: 0.8rem; margin-top: 0.5rem;"></textarea>
        <button id="import-js" data-i18n="convert_js"
          style="width: 100%; margin-top: 0.5rem; background: var(--accent-secondary);">Convert JS to Blocks</button>
      </section>

      <section class="card">
        <h3 data-i18n="select_preset">Select Preset</h3>
        <select id="preset-select"
          style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: white; padding: 0.6rem; font-family: inherit; font-size: 0.9rem; margin-top: 0.5rem; cursor: pointer; outline: none;">
          <option value="" disabled selected data-i18n="select_preset">Select a strategy...</option>
        </select>
      </section>
    </div>
  </div>
  <div id="notification"></div>
  <script type="module" src="/src/main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/TicTacToe-AI-teacher/sw.js')
                .then((reg) => console.log('Service Worker registriert!', reg))
                .catch((err) => console.error('Service Worker Fehler:', err));
      });
    }
  </script>

</body>

</html>
